<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IA na Criptografia de Arquivos</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🔐 IA na Criptografia de Arquivos</h1>
            <p>Entenda como a Inteligência Artificial protege seus dados</p>
        </header>

        <div class="flowchart-container">
            <div id="flowchart" class="flowchart"></div>
        </div>

        <div class="details-panel" id="detailsPanel">
            <div class="close-btn" onclick="closeDetails()">✕</div>
            <h2 id="detailTitle"></h2>
            <p id="detailContent"></p>
            <div id="detailActions"></div>
        </div>

        <button class="reset-btn" onclick="resetFlowchart()">🔄 Resetar Fluxograma</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
